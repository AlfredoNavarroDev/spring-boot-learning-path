spring:
  application:
    name: mini-proyecto-s7
  datasource:
    url: jdbc:h2:file:./data/usuarios;AUTO_SERVER=TRUE
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: 8087

app:
  jwt:
    # Nunca hardcodear el secreto real: esto es solo el default de desarrollo local.
    # En prod viene de una variable de entorno (JWT_SECRET) inyectada por el orquestador.
    secret: ${JWT_SECRET:cambia-esta-clave-de-desarrollo-por-una-real-de-al-menos-32-bytes}
    access-token-minutes: 30
