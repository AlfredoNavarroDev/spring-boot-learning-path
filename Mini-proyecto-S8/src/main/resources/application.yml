spring:
  application:
    name: mini-proyecto-s8
  datasource:
    url: jdbc:h2:file:./data/rbac;AUTO_SERVER=TRUE
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: 8088

app:
  jwt:
    secret: ${JWT_SECRET:cambia-esta-clave-de-desarrollo-por-una-real-de-al-menos-32-bytes}
    access-token-minutes: 30
