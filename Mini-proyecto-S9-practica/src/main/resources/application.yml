spring:
  application:
    name: mini-proyecto-s9
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5434}/${DB_NAME:inventario}
    username: ${DB_USER:inventario}
    password: ${DB_PASSWORD:inventario}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: 8089

app:
  jwt:
    secret: ${JWT_SECRET:cambia-esta-clave-de-desarrollo-por-una-real-de-al-menos-32-bytes}
    access-token-minutes: 30

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
