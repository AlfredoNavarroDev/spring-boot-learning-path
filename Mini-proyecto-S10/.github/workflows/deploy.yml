name: CD - Deploy inventario-api a Render

on:
  push:
    branches: [main]
    paths:
      - 'Mini-proyecto-S9/**'
  workflow_dispatch: {}

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Mini-proyecto-S9
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Tests (gate de calidad antes de desplegar)
        run: ./mvnw -B clean test

  deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      # Render redeploya solo con un webhook (Deploy Hook), no necesita el codigo
      # ni Docker en el runner: Render clona el repo y construye la imagen el mismo.
      - name: Disparar deploy en Render
        run: curl -fsS -X POST "${{ secrets.RENDER_DEPLOY_HOOK_URL }}"
        # RENDER_DEPLOY_HOOK_URL se genera en Render (Settings -> Deploy Hook del
        # servicio) y se guarda como secret del repo en GitHub, nunca en el codigo.
